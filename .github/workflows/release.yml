name: Release (DISABLED until separately approved)

# The release recipe for the separately approved release from `stage`: version
# alias on the already published image, fast-forward of `main`, GitHub release.
# Nothing is rebuilt. The guard fails closed while RELEASE_ENABLED is "false";
# enabling it is a reviewed change that carries the release approval. The
# `production` GitHub environment, the production Dokploy application on VM-10
# and the deployment to it do not exist yet and are created only by that
# separately authorised step, so this workflow performs no production deployment.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full 40-character commit that Stage runs and Goncalo approved."
        required: true
        type: string
      version:
        description: "Release version without the leading v (for example 0.1.0)."
        required: true
        type: string

permissions:
  contents: write
  packages: write

# One delivery run at a time per repository; a live run is never cancelled.
concurrency:
  group: revrook-ce-delivery
  cancel-in-progress: false

env:
  # Flip to "true" only in a separately approved change.
  RELEASE_ENABLED: "false"
  IMAGE: ghcr.io/theriark/revrook-ce
  SOURCE_SHA: ${{ inputs.source_sha }}
  VERSION: ${{ inputs.version }}

jobs:
  guard:
    name: Guard (fails closed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_ENABLED}" != "true" ]]; then
            echo "::error::Release is not enabled for revrook-ce. A separately approved change must enable it."
            exit 1
          fi
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full 40-character SHA"; exit 1; }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }

  release:
    name: Version alias, main fast-forward and GitHub release
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Release only what Stage approved
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/stage" ]] || { echo "::error::release must be dispatched from stage, got ${GITHUB_REF}"; exit 1; }
          git fetch origin +refs/heads/stage:refs/remotes/origin/stage
          [[ "$(git rev-parse refs/remotes/origin/stage)" == "${SOURCE_SHA}" ]] || {
            echo "::error::stage is not ${SOURCE_SHA}"
            exit 1
          }

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Alias the existing image (no rebuild, never latest)
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${SOURCE_SHA}" --format '{{.Manifest.Digest}}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image published for ${SOURCE_SHA}"; exit 1; }
          docker buildx imagetools create --tag "${IMAGE}:v${VERSION}" "${IMAGE}@${digest}"
          echo "DIGEST=${digest}" >> "${GITHUB_ENV}"

      - name: Fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            -f sha="${SOURCE_SHA}" -F force=false >/dev/null
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" == "${SOURCE_SHA}" ]] || { echo "::error::main is ${main_sha}, expected ${SOURCE_SHA}"; exit 1; }

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" --target "${SOURCE_SHA}" --title "revrook CE v${VERSION}" \
            --notes "Image: \`${IMAGE}@${DIGEST}\` (source ${SOURCE_SHA}). Promoted from Stage without a rebuild."
