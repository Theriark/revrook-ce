name: Deploy Development

# On push to development (a merge): the whole merge gate first (ci.yml, called as a
# reusable workflow), then the deploy-development job builds ONE image tagged with
# the source SHA, pushes it to GHCR and deploys that exact digest to the
# Development Dokploy application, then verifies it. Feature branches never start
# this workflow. See docs/ci-cd.md.

on:
  push:
    branches:
      - development

permissions:
  contents: read

# One delivery run at a time per repository, shared with promote-stage.yml,
# rollback.yml and release.yml. A running deployment is never cancelled; a newer
# pending run replaces an older pending one (queue depth one).
concurrency:
  group: revrook-ce-delivery
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (merge gate)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy-development:
    name: Deploy Development (build once, deploy the digest)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/theriark/revrook-ce
      SOURCE_SHA: ${{ github.sha }}
      DEV_APPLICATION_ID: zsYpMEYIAGHbJQZuh_1RT
      DEV_HOST: ce-dev-revrook.theriark.dev
    steps:
      - name: Verify source branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/development" ]] || { echo "::error::Development deploys from development only, got ${GITHUB_REF}"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # Built once. Only the source SHA tag is pushed (never latest); every
          # later step uses the digest.
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Require a valid digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build produced no valid digest"; exit 1; }
      - id: deploy
        uses: ./.github/actions/dokploy-deploy
        with:
          application-id: ${{ env.DEV_APPLICATION_ID }}
          expected-host: ${{ env.DEV_HOST }}
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          health-url: https://${{ env.DEV_HOST }}/healthz
          expected-revision: ${{ github.sha }}
          title: Development ${{ github.sha }}
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Record immutable Development result
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PREVIOUS: ${{ steps.deploy.outputs.previous-image }}
        run: |
          set -euo pipefail
          {
            echo "## revrook-ce deployed to Development"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${DIGEST}\`"
            echo "- Previous image (rollback target): \`${PREVIOUS:-none}\`"
            echo "- URL: https://${DEV_HOST}/"
            echo "- Promote to Stage with promote-stage.yml (source_sha above); roll back with rollback.yml."
          } >> "${GITHUB_STEP_SUMMARY}"
