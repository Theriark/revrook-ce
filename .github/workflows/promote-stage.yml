name: Promote - Stage

# Promote an already built image to the Stage Dokploy application. Never rebuilds.
#
# The private publisher dispatches this workflow with the seven inputs of the publishing
# contract (revision 2). The run name is exactly publishing:<request_id> so the
# publisher can find the run it started. Before ANY write the workflow verifies the
# source commit, the image digest, the Development run and the existing release
# candidate:
#   - source_commit is a commit of development and the stage branch can move to it
#     without force (promote) or is an earlier commit of stage (rollback);
#   - image is the digest CI published for sha-<source_commit>;
#   - development_run_id is the successful CI run on development for that commit whose
#     deploy-development job succeeded;
#   - rc_tag is an existing annotated release candidate prepared earlier on
#     Development (the prepare-rc job of ci.yml). It is verified and CONSUMED: it must
#     point at source_commit and seal the same digest, development run, documentation
#     manifest and an integer gateCycle, and the run that produced it must be a
#     successful run on development. This workflow never mints, moves or deletes an
#     RC tag;
#   - on a promotion, Development runs exactly that digest right now.
# Then the digest is deployed to the registered Stage application (title
# "Stage <full SHA>", description "revrook-ce GitHub Actions run <run ID>"), the image
# is tagged `stage` and the `stage` branch is moved to the commit. This Stage run is
# recorded separately from the RC-producing run.
#
# Rollback is this same workflow with an earlier approved commit, its digest and its
# own earlier RC tag; there is no separate rollback workflow and no tag is created.
# The database is not downgraded: name any irreversible migration before rolling back.
#
# The human Stage decision is the native Paperclip approval that precedes the dispatch.
# No second GitHub approval is added. See docs/ci-cd.md.

run-name: publishing:${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Publisher request identifier (run name publishing:<request_id>)."
        required: true
        type: string
      version:
        description: "Stable version this candidate belongs to, 27.<minor>.<patch> (a leading v is accepted)."
        required: true
        type: string
      source_commit:
        description: "Exact approved commit (full 40-character SHA)."
        required: true
        type: string
      image:
        description: "Immutable image digest published for the commit: ghcr.io/theriark/revrook-ce@sha256:<64 hex> or sha256:<64 hex>."
        required: true
        type: string
      development_run_id:
        description: "Run ID of the CI run on development that built and deployed the commit."
        required: true
        type: string
      documentation_manifest_sha256:
        description: "Reviewed documentation manifest hash (64 hex), sealed into the RC tag."
        required: true
        type: string
      rc_tag:
        description: "Existing annotated release candidate tag of this candidate, v27.<minor>.<patch>-rc.<n>."
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

# One delivery run at a time per repository (shared with CI on development, and
# Promote - Production and Finalize Release); a live run is never cancelled.
concurrency:
  group: revrook-ce-delivery
  cancel-in-progress: false

jobs:
  promote:
    name: Promote or roll back Stage to an immutable digest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: stage
    env:
      IMAGE: ghcr.io/theriark/revrook-ce
      REQUEST_ID: ${{ inputs.request_id }}
      VERSION_INPUT: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_commit }}
      IMAGE_INPUT: ${{ inputs.image }}
      DEV_RUN_ID: ${{ inputs.development_run_id }}
      MANIFEST_SHA256: ${{ inputs.documentation_manifest_sha256 }}
      RC_TAG: ${{ inputs.rc_tag }}
      DEV_APPLICATION_ID: zsYpMEYIAGHbJQZuh_1RT
      DEV_HOST: ce-dev-revrook.theriark.dev
      STAGE_APPLICATION_ID: 7QVBrkTn6rzEcICxV9GTj
      STAGE_HOST: ce-stg-revrook.theriark.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate the inputs and the promotion source
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          [[ "${REQUEST_ID}" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "::error::request_id must be 1 to 128 letters, digits or . _ : -"; exit 1; }
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_commit must be a full 40-character commit SHA"; exit 1; }
          [[ "${VERSION_INPUT}" =~ ^v?(27\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]] || { echo "::error::version must look like 27.<minor>.<patch>"; exit 1; }
          base_version="${BASH_REMATCH[1]}"
          [[ "${DEV_RUN_ID}" =~ ^[1-9][0-9]{0,17}$ ]] || { echo "::error::development_run_id must be a run ID (integer)"; exit 1; }
          [[ "${MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::documentation_manifest_sha256 must be 64 lowercase hex characters"; exit 1; }
          [[ "${RC_TAG}" == "v${base_version}-rc."* && "${RC_TAG##*-rc.}" =~ ^[0-9]+$ ]] || { echo "::error::rc_tag must look like v${base_version}-rc.<n>"; exit 1; }
          digest="${IMAGE_INPUT#"${IMAGE}@"}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::image must be ${IMAGE}@sha256:<64 hex> or sha256:<64 hex>"; exit 1; }
          case "${GITHUB_REF}" in
            refs/heads/development | refs/heads/stage) ;;
            *) echo "::error::Promote - Stage runs from development or stage, got ${GITHUB_REF}"; exit 1 ;;
          esac
          git fetch origin +refs/heads/development:refs/remotes/origin/development
          git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/development || {
            echo "::error::${SOURCE_SHA} is not a commit of development"
            exit 1
          }
          # The stage branch must exist and the move must be allowed BEFORE anything
          # is written to Stage, so a branch problem cannot fail the run after the
          # deployment. Promote: stage must be an ancestor of source_commit (a
          # fast-forward, also when it already equals it). Rollback: source_commit
          # must be an earlier commit of stage.
          git fetch origin +refs/heads/stage:refs/remotes/origin/stage || {
            echo "::error::the stage branch does not exist; create it before promoting"
            exit 1
          }
          if git merge-base --is-ancestor refs/remotes/origin/stage "${SOURCE_SHA}"; then
            rollback=false
            changed="$(git diff --name-only refs/remotes/origin/stage "${SOURCE_SHA}" -- .github/workflows)"
          elif git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/stage; then
            rollback=true
            changed="$(git diff --name-only "${SOURCE_SHA}" refs/remotes/origin/stage -- .github/workflows)"
          else
            echo "::error::stage and ${SOURCE_SHA} have diverged; refusing to move the stage branch"
            exit 1
          fi
          # GITHUB_TOKEN has no `workflows` permission: GitHub refuses to move a branch
          # when the move changes a file under .github/workflows. Fail now, before the
          # Stage deployment, rather than after it.
          if [[ -n "${changed}" ]]; then
            echo "::error::moving stage would change workflow files (${changed//$'\n'/, }); GITHUB_TOKEN cannot do that. A reviewed workflow-only route must first bring stage to a commit with identical workflow files."
            exit 1
          fi
          {
            echo "rollback=${rollback}"
            echo "digest=${digest}"
            echo "base_version=${base_version}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify the image digest published for this commit
        shell: bash
        env:
          DIGEST: ${{ steps.mode.outputs.digest }}
        run: |
          set -euo pipefail
          published="$(docker buildx imagetools inspect "${IMAGE}:sha-${SOURCE_SHA}" --format '{{.Manifest.Digest}}')"
          [[ "${published}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image published for ${SOURCE_SHA}"; exit 1; }
          [[ "${published}" == "${DIGEST}" ]] || {
            echo "::error::${IMAGE}:sha-${SOURCE_SHA} is ${published}, not the requested ${DIGEST}; refusing"
            exit 1
          }
          echo "Verified ${IMAGE}@${DIGEST}"

      - name: Verify the Development run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEV_RUN_ID}")"
          jq -e --arg sha "${SOURCE_SHA}" '
              .path == ".github/workflows/ci.yml"
              and .event == "push"
              and .head_branch == "development"
              and .head_sha == $sha
              and .status == "completed"
              and .conclusion == "success"' <<<"${run}" >/dev/null || {
            echo "::error::run ${DEV_RUN_ID} is not a successful CI push run on development for ${SOURCE_SHA}"
            exit 1
          }
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${DEV_RUN_ID}/jobs" --jq '.jobs[] | [.name, .conclusion] | @tsv' > jobs.tsv
          grep -Fq $'Deploy Development (build once, deploy the digest)\tsuccess' jobs.tsv || {
            echo "::error::run ${DEV_RUN_ID} has no successful Development deployment job"
            exit 1
          }
          rm -f jobs.tsv
          echo "Verified Development run ${DEV_RUN_ID} for ${SOURCE_SHA}"

      - name: Verify and consume the existing RC tag
        id: rc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.mode.outputs.digest }}
        run: |
          set -euo pipefail
          # Read only: this workflow never creates, moves or deletes a tag.
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC_TAG}")" || { echo "::error::${RC_TAG} does not exist; prepare the release candidate on Development first"; exit 1; }
          [[ "$(jq -r '.object.type' <<<"${ref}")" == "tag" ]] || { echo "::error::${RC_TAG} is not an annotated tag"; exit 1; }
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r '.object.sha' <<<"${ref}")")"
          jq -e --arg t "${RC_TAG}" --arg c "${SOURCE_SHA}" --arg d "${DIGEST}" --arg m "${MANIFEST_SHA256}" \
              --argjson dev "${DEV_RUN_ID}" '
              .tag == $t and .object.type == "commit" and .object.sha == $c
              and ((.message | fromjson) as $j
                | ($j | type) == "object"
                and $j.sourceCommit == $c and $j.imageDigest == $d
                and $j.developmentRunId == $dev
                and ($j.workflowRunId | type) == "number" and $j.workflowRunId >= 1 and $j.workflowRunId == ($j.workflowRunId | floor)
                and $j.documentationManifestSha256 == $m
                and ($j.gateCycle | type) == "number" and $j.gateCycle >= 1 and $j.gateCycle == ($j.gateCycle | floor))' <<<"${object}" >/dev/null || {
            echo "::error::${RC_TAG} does not seal this commit, digest, development run, documentation manifest and an integer gateCycle"
            exit 1
          }
          rc_run="$(jq -r '(.message | fromjson).workflowRunId' <<<"${object}")"
          gate_cycle="$(jq -r '(.message | fromjson).gateCycle' <<<"${object}")"
          # The run that produced the RC: a successful prepare-rc run of this
          # repository on development, separate from this Stage run.
          jq -e --arg repo "${GITHUB_REPOSITORY}" '
              .repository.full_name == $repo
              and .path == ".github/workflows/ci.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "development"
              and .status == "completed"
              and .conclusion == "success"' <<<"$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${rc_run}")" >/dev/null || {
            echo "::error::run ${rc_run} is not a successful CI run on development that prepared ${RC_TAG}"
            exit 1
          }
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${rc_run}/jobs" --jq '.jobs[] | [.name, .conclusion] | @tsv' > rc-jobs.tsv
          grep -Fq $'Prepare RC (tag the tested Development image)\tsuccess' rc-jobs.tsv || {
            echo "::error::run ${rc_run} has no successful RC preparation job"
            exit 1
          }
          rm -f rc-jobs.tsv
          [[ "${rc_run}" != "${GITHUB_RUN_ID}" ]] || { echo "::error::the RC-producing run must not be this Stage run"; exit 1; }
          {
            echo "tag=${RC_TAG}"
            echo "run=${rc_run}"
            echo "gate_cycle=${gate_cycle}"
          } >> "${GITHUB_OUTPUT}"
          echo "Verified ${RC_TAG} (RC-producing run ${rc_run}, gate cycle ${gate_cycle})"

      - name: Confirm Development runs exactly this digest
        if: steps.mode.outputs.rollback != 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.mode.outputs.digest }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for required in DOKPLOY_URL DOKPLOY_API_KEY CF_ID CF_SECRET; do
            [[ -n "${!required}" ]] || { echo "::error::${required} is missing from the stage environment"; exit 1; }
          done
          running="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            --header "CF-Access-Client-Id: ${CF_ID}" \
            --header "CF-Access-Client-Secret: ${CF_SECRET}" \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --get "${DOKPLOY_URL%/}/api/application.one" \
            --data-urlencode "applicationId=${DEV_APPLICATION_ID}" | jq -r '.dockerImage // empty')"
          [[ "${running}" == "${IMAGE}@${DIGEST}" ]] || {
            echo "::error::Development runs '${running}', not ${IMAGE}@${DIGEST}"
            exit 1
          }
          curl --fail --silent --show-error --max-time 15 "https://${DEV_HOST}/healthz" >/dev/null

      - id: deploy
        uses: ./.github/actions/dokploy-deploy
        with:
          application-id: ${{ env.STAGE_APPLICATION_ID }}
          expected-host: ${{ env.STAGE_HOST }}
          image: ${{ env.IMAGE }}@${{ steps.mode.outputs.digest }}
          health-url: https://${{ env.STAGE_HOST }}/healthz
          expected-revision: ${{ env.SOURCE_SHA }}
          title: Stage ${{ env.SOURCE_SHA }}
          # A failed rollback is not rolled forward again automatically.
          restore-on-failure: ${{ steps.mode.outputs.rollback == 'true' && 'false' || 'true' }}
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Tag the promoted image as stage
        shell: bash
        env:
          DIGEST: ${{ steps.mode.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:stage" "${IMAGE}@${DIGEST}"

      - name: Point the stage branch at the deployed commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK: ${{ steps.mode.outputs.rollback }}
        run: |
          set -euo pipefail
          force=false
          # Moving backwards was already validated before the deployment (the
          # current stage head descends from the commit being restored).
          if [[ "${ROLLBACK}" == "true" ]]; then
            force=true
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/stage" \
            -f sha="${SOURCE_SHA}" -F force="${force}" >/dev/null
          stage_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/stage" --jq '.object.sha')"
          [[ "${stage_sha}" == "${SOURCE_SHA}" ]] || { echo "::error::stage is ${stage_sha}, expected ${SOURCE_SHA}"; exit 1; }

      - name: Record the Stage result
        shell: bash
        env:
          DIGEST: ${{ steps.mode.outputs.digest }}
          PREVIOUS: ${{ steps.deploy.outputs.previous-image }}
          ROLLBACK: ${{ steps.mode.outputs.rollback }}
          RC_RUN: ${{ steps.rc.outputs.run }}
          GATE_CYCLE: ${{ steps.rc.outputs.gate_cycle }}
        run: |
          set -euo pipefail
          {
            if [[ "${ROLLBACK}" == "true" ]]; then
              echo "## revrook-ce Stage rolled back"
            else
              echo "## revrook-ce promoted to Stage"
            fi
            echo
            echo "- Request: \`${REQUEST_ID}\`"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${DIGEST}\` (no rebuild)"
            echo "- Development run: \`${DEV_RUN_ID}\`; RC-producing run: \`${RC_RUN}\`; Stage run: \`${GITHUB_RUN_ID}\`"
            echo "- RC tag consumed (not created here): \`${RC_TAG}\`; gate cycle: \`${GATE_CYCLE}\`; documentation manifest: \`${MANIFEST_SHA256}\`"
            echo "- Previous Stage image (rollback target): \`${PREVIOUS:-none}\`"
            echo "- URL: https://${STAGE_HOST}/"
            echo "- Stage branch: \`${SOURCE_SHA}\`; main is unchanged"
            if [[ "${ROLLBACK}" == "true" ]]; then
              echo "- The database was not downgraded. Check release notes for irreversible migrations."
            else
              echo "- Next: human QA in Jira"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
