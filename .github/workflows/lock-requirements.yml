name: Lock requirements

# Generates the hashed lock files requirements.txt and requirements-dev.txt with
# pip-compile on Linux and Python 3.12 (the same environment as CI) and commits
# them back to the SAME branch with the repository GITHUB_TOKEN. No secret, no
# personal access token, no new credential. See docs/ci-cd.md.
#
# Triggers: a push that changes requirements.in or requirements-dev.in, or a
# manual dispatch. Pull requests from forks never run this workflow (it has no
# pull_request trigger), and a push only exists inside this repository.
#
# No loop: the commit it makes touches only requirements.txt and
# requirements-dev.txt, which are not in the trigger paths, and a push made with
# GITHUB_TOKEN does not start a push workflow in any case. When the compiled files
# are identical to the committed ones nothing is committed.
#
# A push made with GITHUB_TOKEN also does not start the pull_request CI run, so
# after committing this workflow dispatches ci.yml on the new head (workflow_dispatch
# is the documented exception that GITHUB_TOKEN may trigger) and waits until that
# run is visible on the new commit.

on:
  push:
    branches-ignore:
      - main
      - development
      - stage
      - production
    paths:
      - requirements.in
      - requirements-dev.in
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One run per branch at a time; a lock run is never cancelled half way through a
# commit. Not part of the delivery group: it publishes and deploys nothing.
concurrency:
  group: lock-requirements-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Exact tool version so two runs on the same inputs agree.
  PIP_TOOLS_VERSION: "7.5.0"

jobs:
  lock:
    name: Compile and commit hashed locks
    # Same-repository, non-protected branches only.
    if: >-
      github.event.repository.fork == false &&
      github.ref_type == 'branch' &&
      github.actor != 'github-actions[bot]' &&
      !contains(fromJSON('["main","development","stage","production"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile the runtime lock, then the development lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip-tools==${PIP_TOOLS_VERSION}"
          python --version
          pip --version
          pip-compile --version
          # Runtime first: requirements-dev.in uses requirements.txt as a constraint.
          pip-compile --generate-hashes --strip-extras --output-file requirements.txt requirements.in
          pip-compile --generate-hashes --strip-extras --output-file requirements-dev.txt requirements-dev.in
      - name: Commit changed locks to the branch
        id: commit
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add requirements.txt requirements-dev.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lock files are already up to date. Nothing committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update hashed requirements lock files"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run CI on the new head
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          NEW_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "${BRANCH}"
          found=""
          for i in $(seq 1 12); do
            sleep 5
            found="$(gh run list --workflow ci.yml --branch "${BRANCH}" --event workflow_dispatch \
              --json databaseId,headSha --jq "[.[] | select(.headSha == \"${NEW_SHA}\")][0].databaseId // empty")"
            [[ -n "${found}" ]] && break
          done
          [[ -n "${found}" ]] || { echo "::error::ci.yml was dispatched but no run appeared on ${NEW_SHA}"; exit 1; }
          {
            echo "## Lock files committed"
            echo
            echo "- Branch: \`${BRANCH}\`"
            echo "- New head: \`${NEW_SHA}\`"
            echo "- CI run on that head (workflow_dispatch): ${found}"
          } >> "${GITHUB_STEP_SUMMARY}"
