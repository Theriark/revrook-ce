name: Lock requirements

# Generates the hashed lock files requirements.txt and requirements-dev.txt with
# pip-compile on Linux and Python 3.12 (the same environment as CI) and commits
# them back to the SAME branch with the repository GITHUB_TOKEN. No secret, no
# personal access token, no new credential. See docs/ci-cd.md.
#
# Trigger: manual dispatch of a branch ONLY. A push never runs this workflow, so
# a burst of pushes cannot start runs, and pull requests from forks cannot run it
# (it has no pull_request trigger). Dispatch it from the Actions page or with
# `gh workflow run lock-requirements.yml --ref <branch>` after changing
# requirements.in or requirements-dev.in.
#
# No loop: there is no push trigger, so its own commit cannot start it again, and
# a push made with GITHUB_TOKEN never starts a push or pull_request workflow in
# any case. When the compiled files are identical to the committed ones nothing
# is committed. The commit does not start CI either: request one CI run for the
# new head with the CI request broker (label ci-go).

on:
  workflow_dispatch:

permissions:
  contents: write

# One shared group per repository for every non-CI workflow (build, promotion,
# rollback, lock): they never run at the same time and a live run is never
# cancelled. Pull request CI uses its own group (see docs/ci-cd.md).
concurrency:
  group: revrook-ce-delivery
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Exact tool versions so two runs on the same inputs agree.
  PIP_VERSION: "25.1.1"
  PIP_TOOLS_VERSION: "7.5.0"

jobs:
  lock:
    name: Compile and commit hashed locks
    # Same-repository, non-protected branches only.
    if: >-
      github.event.repository.fork == false &&
      github.ref_type == 'branch' &&
      github.actor != 'github-actions[bot]' &&
      !contains(fromJSON('["main","development","stage","production"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile the runtime lock, then the development lock
        shell: bash
        run: |
          set -euo pipefail
          # Both tools are pinned: pip-tools reaches into pip internals, so a newer
          # pip than the pip-tools release supports breaks pip-compile.
          python -m pip install "pip==${PIP_VERSION}" "pip-tools==${PIP_TOOLS_VERSION}"
          python --version
          pip --version
          pip-compile --version
          # On failure keep the tail of the output as an annotation (visible in
          # the check run) because the full log needs a signed-in session.
          fail() {
            echo "::error::pip-compile failed: $(tail -n 12 compile.log | tr '\n' '|' | cut -c1-900)"
            exit 1
          }
          # Runtime first: requirements-dev.in uses requirements.txt as a constraint.
          # --allow-unsafe pins setuptools (a dependency of pip-tools): without it
          # the lock omits setuptools and pip --require-hashes refuses to install it.
          pip-compile --generate-hashes --strip-extras --allow-unsafe --output-file requirements.txt requirements.in > compile.log 2>&1 || fail
          cat compile.log
          pip-compile --generate-hashes --strip-extras --allow-unsafe --output-file requirements-dev.txt requirements-dev.in > compile.log 2>&1 || fail
          cat compile.log
          rm -f compile.log
      - name: Commit changed locks to the branch
        id: commit
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add requirements.txt requirements-dev.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lock files are already up to date. Nothing committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update hashed requirements lock files"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          NEW_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "## Lock files committed"
            echo
            echo "- Branch: \`${BRANCH}\`"
            echo "- New head: \`${NEW_SHA}\`"
            echo "- CI was NOT started. Request one run for this head with the CI request broker (label \`ci-go\`)."
          } >> "${GITHUB_STEP_SUMMARY}"
