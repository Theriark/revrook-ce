version: 2
updates:
  # Keeps action versions current. Every action is pinned to a full commit SHA with
  # the major tag in a comment; Dependabot updates the SHA and that comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Keeps the postgres:16 image of docker-compose.yml on its newest digest (the image
  # is pinned to a digest; the two CI service containers in ci.yml carry the same
  # digest and are moved with it by hand, see docs/ci-cd.md).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
