# Local and CI stack: web, worker and a PostgreSQL 16 database.
# Copy .env.example to .env first (docker compose --env-file .env.ci in CI).
# Every value below is a throwaway local value, never a deployment secret.

name: revrook

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://revrook:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/revrook
  SECRET_KEY: ${SECRET_KEY:?copy .env.example to .env}
  FERNET_KEY: ${FERNET_KEY:?copy .env.example to .env}
  BASE_URL: http://localhost:8080
  EVIDENCE_DIR: /data/evidence

services:
  db:
    # postgres:16, pinned to the multi-arch index digest of 2026-11-07; Dependabot
    # (docker-compose, .github/dependabot.yml) proposes newer digests.
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: revrook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: revrook
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP. Without it pg_isready answers from the unix
      # socket, which the temporary init-time server also serves, so web and
      # worker could start before the real server listens on 5432.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U revrook -d revrook"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    environment:
      <<: *app-environment
      ROLE: web
    ports:
      - "8080:8080"
    volumes:
      - evidence:/data
    read_only: true
    tmpfs:
      - /tmp
    # Declared here as well as in the image: the worker waits for this check,
    # and the static compose test requires every service_healthy dependency
    # to carry its own. Same probe as the Dockerfile HEALTHCHECK.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    # The role is also passed as the command, so PID 1 is `python -m app.cli
    # worker`. The health check below reads that command line.
    command: ["worker"]
    environment:
      <<: *app-environment
      ROLE: worker
    volumes:
      - evidence:/data
    read_only: true
    tmpfs:
      - /tmp
    # The image health check probes the web port, which the worker does not
    # serve, so the worker has its own. `docker compose up --wait` rejects a
    # service with no health check, so it cannot be disabled. Healthy means
    # PID 1 is still the worker process. A startup failure makes the process
    # exit and the container stop, which compose reports as a failure.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys; sys.exit(0 if 'worker' in open('/proc/1/cmdline').read().split(chr(0)) else 1)"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      # The evidence volume is empty on the first start and Docker copies the
      # image's /data into it when the first container is created. Web and
      # worker created at the same moment both did that copy and raced
      # ("failed to mkdir ... file exists"). Waiting for a healthy web means
      # exactly one container ever populates the volume.
      web:
        condition: service_healthy

volumes:
  db-data:
  evidence:
