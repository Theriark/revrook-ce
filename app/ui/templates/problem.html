{% extends "base.html" %}
{% block nav %}{% include "_nav.html" %}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="rv-errors" role="alert">
<p class="rv-errors-title"><span class="rv-status-icon" aria-hidden="true">!</span> {{ message }}</p>
{% if details %}
<ul>
{% for item in details %}
<li>{{ item }}</li>
{% endfor %}
</ul>
{% endif %}
</div>
<p><a href="/clients">Back to the clients</a></p>
{% endblock %}
