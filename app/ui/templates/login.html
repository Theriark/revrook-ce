{% extends "base.html" %}
{% block content %}
<section class="rv-auth">
<h1>Sign in</h1>
<p class="rv-auth-lead">Use the administrator account of this installation.</p>
{% include "_errors.html" %}
<form method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="rv-field">
<label for="username">Username</label>
<input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required>
</div>
<div class="rv-field">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<button type="submit" class="rv-button-block">Sign in</button>
</form>
</section>
{% endblock %}
