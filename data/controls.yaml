  G.isMfaCapable: {adapter: entra-registration, column: mfa_capable}
  G.isAdmin: {adapter: entra-registration, column: is_admin}
  G.userType: {adapter: entra-registration, column: user_type}
  G.ca.state: {adapter: conditional-access, column: state}
  G.ca.users: {adapter: conditional-access, column: all_users}
  G.ca.applications: {adapter: conditional-access, column: all_apps}
  G.ca.grantControls.mfa: {adapter: conditional-access, column: requires_mfa}
  G.ca.grantControls.block: {adapter: conditional-access, column: blocks}
  G.ca.clientAppTypes: {adapter: conditional-access, column: legacy_clients}
  G.ca.exclusions: {adapter: conditional-access, column: exclusions}
  G.securityDefaults: {adapter: conditional-access, column: tenant_state}
  G.role.displayName: {adapter: directory-roles, column: role}
  G.role.permanent: {adapter: directory-roles, column: permanent}
  G.role.memberEnabled: {adapter: directory-roles, column: enabled}
  G.managedDevices.id: {adapter: intune-devices, column: device_id}
  G.managedDevices.lastSyncDateTime: {adapter: intune-devices, column: last_contact}
  G.managedDevices.operatingSystem: {adapter: intune-devices, column: os}
  G.managedDevices.osVersion: {adapter: intune-devices, column: os_version}
  G.managedDevices.isEncrypted: {adapter: intune-devices, column: encrypted}
  G.managedDevices.complianceState: {adapter: intune-devices, column: compliance}
  R.device_id: {adapter: device-inventory, column: device_id}
  R.last_seen_utc: {adapter: device-inventory, column: last_seen}
  R.os: {adapter: device-inventory, column: os}
  R.os_build: {adapter: device-inventory, column: os_build}
  R.form_factor: {adapter: device-inventory, column: form_factor}
  R.last_patch_utc: {adapter: device-inventory, column: last_patch}
  R.pending_critical: {adapter: device-inventory, column: pending_critical_updates}
  R.av_status: {adapter: device-inventory, column: av_status}
  R.av_def_date_utc: {adapter: device-inventory, column: av_signature_date}
  R.disk_encrypted: {adapter: device-inventory, column: disk_encrypted}
  R.local_admin_count: {adapter: device-inventory, column: local_admin_count}
  R.tamper_protection: {adapter: device-inventory, column: tamper_protection}
  R.dns_filter_active: {adapter: device-inventory, column: dns_filter_active}
  R.log_forwarding: {adapter: device-inventory, column: log_forwarding}
  B.asset_id: {adapter: backup-export, column: system_or_device}
  B.asset_type: {adapter: backup-export, column: asset_type}
  B.schedule_hours: {adapter: backup-export, column: schedule_hours}
  B.last_success_utc: {adapter: backup-export, column: last_success}
  B.last_status: {adapter: backup-export, column: last_result}
  B.retention_days: {adapter: backup-export, column: retention_days}
  B.encrypted: {adapter: backup-export, column: encrypted}
  B.immutable: {adapter: backup-export, column: immutable}
  B.offsite: {adapter: backup-export, column: offsite}
  B.last_restore_test_utc: {adapter: backup-export, column: restore_test_date}
  B.restore_test_result: {adapter: backup-export, column: restore_test_result}
  N.firmware_release_date: {adapter: network-export, column: firmware_release_date}
  N.end_of_support_date: {adapter: network-export, column: end_of_support_date}
  N.perimeter: {adapter: network-export, column: perimeter}
  N.rules.enabled: {adapter: network-export, column: rule_enabled}
  N.rules.direction: {adapter: network-export, column: direction}
  N.rules.action: {adapter: network-export, column: action}
  N.rules.source: {adapter: network-export, column: source}
  N.rules.destination_port: {adapter: network-export, column: destination_port}
  N.wan_admin_enabled: {adapter: network-export, column: wan_admin_enabled}
  N.default_credentials_flag: {adapter: network-export, column: default_credentials_flag}
  N.ssid: {adapter: network-export, column: ssid}
  N.security_mode: {adapter: network-export, column: security_mode}
  N.guest_isolated: {adapter: network-export, column: guest_isolated}
  N.guest_ssid: {adapter: network-export, column: guest_ssid}
  N.syslog_target: {adapter: network-export, column: syslog_target}
  T.user_id: {adapter: training-csv, column: user_id}
  T.completed_utc: {adapter: training-csv, column: completed_utc}
  H.user_id: {adapter: leavers-csv, column: user_id}
  H.leave_date: {adapter: leavers-csv, column: leave_date}
  H.account_enabled: {adapter: leavers-csv, column: account_enabled}
  X.dkim.domain: {adapter: exchange-export, column: domain}
  X.dkim.enabled: {adapter: exchange-export, column: enabled}
  X.policy_type: {adapter: exchange-export, column: policy_type}
  X.policy.enabled: {adapter: exchange-export, column: enabled}
  X.auto_forwarding_mode: {adapter: exchange-export, column: auto_forwarding_mode}
  X.mailbox.forwarding_external: {adapter: exchange-export, column: forwarding_external}
  X.recipient_type: {adapter: exchange-export, column: recipient_type}
  X.mailbox.account_enabled: {adapter: exchange-export, column: account_enabled}
  X.unified_audit_log_enabled: {adapter: exchange-export, column: unified_audit_log_enabled}
  X.audit_disabled: {adapter: exchange-export, column: audit_disabled}
  X.alert.kind: {adapter: exchange-export, column: alert_kind}
  X.alert.disabled: {adapter: exchange-export, column: disabled}
  X.alert.recipient_count: {adapter: exchange-export, column: recipient_count}
  X.alert.last_acknowledged: {adapter: exchange-export, column: last_acknowledged}

# Fields no CE importer reads, and why. The reasons are those of
# docs/importers.md: licence_or_scope (a licence tier or a permission outside the
# verified list), dnscheck (our own public DNS check, phase 7) and shipped_list
# (matched against a list we ship).
unavailable:
  G.user.signInActivity: licence_or_scope
  G.user.accountEnabled: licence_or_scope
  G.authorizationPolicy.invitations: licence_or_scope
  G.deviceConfigurationProfile: licence_or_scope
  G.windowsProtectionState: licence_or_scope
  G.signatureUpdateOverdue: licence_or_scope
  G.securityAlerts: licence_or_scope
  G.oauth2PermissionGrants: licence_or_scope
  G.servicePrincipals: licence_or_scope
  G.licensedMailboxes: licence_or_scope
  R.threats: licence_or_scope
  R.installed_software: shipped_list
  D.spf: dnscheck
  D.dkim_selectors: dnscheck
  D.dmarc: dnscheck

controls:
  # ---- ACC identity and MFA (domain weight 22) ---------------------------------
  - id: PC-ACC-01
    domain: ACC
    title: "Every active staff account signs in with more than a password."
    weight: 3
    gate: true
    manual_only: false
    max_age_days: {automatic: 35, manual: 365}
    sources: [G]
    fields: [G.isMfaRegistered, G.isMfaCapable]
    rule:
      kind: share
      pass: {at_least: "0.98"}
      partial: {at_least: "0.80"}
      text: "userRegistrationDetails isMfaRegistered and isMfaCapable over U. Pass share at least 0.98; partial 0.80 to under 0.98; fail below."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.AA-03", verified: false}
      - {framework: sp800-171, id: "03.05.03", verified: false}
      - {framework: cis, id: "6.3", verified: false}
      - {framework: cis, id: "6.4", verified: false}
      - {framework: iso27001, id: "A.8.5", verified: false}
      - {framework: cyber-essentials, id: "User access control", verified: false}
      - {framework: nis2, id: "j", verified: false}

  - id: PC-ACC-02
    domain: ACC
    title: "Every administrator uses MFA."
    weight: 3
    gate: true
    manual_only: false
    max_age_days: {automatic: 35, manual: 365}
    sources: [G]
    fields: [G.isAdmin, G.isMfaRegistered]
    rule:
      kind: count
      pass: {at_most: 0}
      text: "userRegistrationDetails isAdmin and isMfaRegistered over A. Pass 0 admins without MFA, else fail."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.AA-03", verified: false}
      - {framework: csf, id: "PR.AA-05", verified: false}
      - {framework: sp800-171, id: "03.05.03", verified: false}
      - {framework: sp800-171, id: "03.01.06", verified: false}
      - {framework: cis, id: "6.5", verified: false}
      - {framework: iso27001, id: "A.8.2", verified: false}
      - {framework: iso27001, id: "A.8.5", verified: false}
      - {framework: cyber-essentials, id: "User access control", verified: false}
      - {framework: nis2, id: "j", verified: false}

  - id: PC-ACC-03
    domain: ACC
    title: "MFA is enforced by policy, not only registered."
    weight: 3
    gate: false
    manual_only: false
    max_age_days: {automatic: 35, manual: 365}
    sources: [G]
    fields:
      - G.ca.state
      - G.ca.users
      - G.ca.applications
      - G.ca.grantControls.mfa
      - G.ca.exclusions
      - G.securityDefaults
    rule:
      kind: state
      text: "Conditional Access policies (state, users, applications, grantControls) and the security-defaults policy. Pass if security defaults are on or an enabled policy targets all users and all applications with an MFA grant and at most 2 exclusions; partial if report-only or admins only; fail otherwise. A tenant on security defaults has an empty policy list and is shown as security-defaults."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.AA-03", verified: false}
      - {framework: sp800-171, id: "03.05.03", verified: false}
      - {framework: cis, id: "6.3", verified: false}
      - {framework: iso27001, id: "A.8.5", verified: false}
      - {framework: cyber-essentials, id: "User access control", verified: false}
      - {framework: nis2, id: "j", verified: false}

  - id: PC-ACC-04
    domain: ACC
    title: "Legacy sign-in methods that skip MFA are blocked."
    weight: 2
    gate: false
    manual_only: false
    max_age_days: {automatic: 35, manual: 365}
    sources: [G]
    fields: [G.ca.state, G.ca.grantControls.block, G.ca.clientAppTypes, G.securityDefaults]
    rule:
      kind: state
      text: "Conditional Access policy client app types, or security defaults. Pass if an enabled policy blocks legacy types for all users or defaults are on; partial report-only or partial scope; fail otherwise."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.AA-03", verified: false}
      - {framework: sp800-171, id: "03.05.03", verified: false, uncertain: true}
      - {framework: cis, id: "4.8", verified: false, uncertain: true}
      - {framework: cis, id: "6.3", verified: false, uncertain: true}
      - {framework: iso27001, id: "A.8.5", verified: false}
      - {framework: cyber-essentials, id: "Secure configuration", verified: false}
      - {framework: nis2, id: "j", verified: false}

  - id: PC-ACC-05
    domain: ACC
    title: "Few, personal, permanent top-level administrators."
    weight: 2
    gate: false
    manual_only: false
    max_age_days: {automatic: 35, manual: 365}
    sources: [G, M]
    fields: [G.role.displayName, G.role.permanent, G.role.memberEnabled]
    rule:
      kind: state
      text: "Role assignments for Global Administrator (the unified role-management API is unverified) or a manual admin list. Count of distinct enabled users with a permanent assignment: pass 2 to 4; partial 1 or 5 to 6; fail 7 or more."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.AA-05", verified: false}
      - {framework: sp800-171, id: "03.01.05", verified: false}
      - {framework: sp800-171, id: "03.01.06", verified: false}
      - {framework: cis, id: "5.4", verified: false}
      - {framework: cis, id: "6.8", verified: false}
      - {framework: iso27001, id: "A.8.2", verified: false}
      - {framework: cyber-essentials, id: "User access control", verified: false}
      - {framework: nis2, id: "i", verified: false}

  - id: PC-ACC-06
    domain: ACC
    title: "Dormant accounts are disabled."
    weight: 2
    gate: false
    manual_only: false
    max_age_days: {automatic: 35, manual: 365}
    sources: [G]
    fields: [G.user.signInActivity, G.user.accountEnabled]
    automatic_unavailable: licence_or_scope
    rule:
      kind: state
      text: "users signInActivity (needs a licence tier that exposes it) and accountEnabled. Z = enabled members with no sign-in for over 90 days (or none and created over 90 days ago). Pass Z = 0; partial share at most 0.10; fail above; field absent = unknown."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.AA-01", verified: false}
      - {framework: sp800-171, id: "03.01.01", verified: false}
      - {framework: cis, id: "5.3", verified: false}
      - {framework: iso27001, id: "A.5.18", verified: false}
      - {framework: cyber-essentials, id: "User access control", verified: false}
      - {framework: nis2, id: "i", verified: false}

  - id: PC-ACC-07
    domain: ACC
    title: "Guest and external access is reviewed."
    weight: 1
    gate: false
    manual_only: false
    max_age_days: {automatic: 35, manual: 365}
    sources: [G]
    fields: [G.userType, G.user.signInActivity, G.authorizationPolicy.invitations]
    automatic_unavailable: licence_or_scope
    rule:
      kind: state
      text: "users userType Guest, signInActivity, authorizationPolicy invitation setting. Pass if no guest inactive over 180 days and invitations limited to admins or guest inviters; partial inactive share at most 0.25; fail above."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.AA-05", verified: false}
      - {framework: sp800-171, id: "03.01.20", verified: false, uncertain: true}
      - {framework: cis, id: "5.3", verified: false}
      - {framework: cis, id: "6.1", verified: false}
      - {framework: iso27001, id: "A.5.18", verified: false}
      - {framework: cyber-essentials, id: "User access control", verified: false}
      - {framework: nis2, id: "i", verified: false}

  - id: PC-ACC-08
    domain: ACC
    title: "Emergency (break-glass) access is documented and protected."
    weight: 1
    gate: false
    manual_only: true
    max_age_days: {automatic: null, manual: 365}
    sources: [M]
    fields: []
    rule:
      kind: manual
      text: "Judged by a named reviewer from the artefact."
    manual_alternative: false
    artefact: "Artefact naming the accounts, where credentials are kept and a test within 12 months."
    mappings:
      - {framework: csf, id: "PR.AA-05", verified: false, uncertain: true}
      - {framework: sp800-171, id: "03.01.01", verified: false, uncertain: true}
      - {framework: cis, id: "5.4", verified: false, uncertain: true}
      - {framework: iso27001, id: "A.5.18", verified: false, uncertain: true}
      - {framework: cyber-essentials, id: "User access control", verified: false}
      - {framework: nis2, id: "i", verified: false}

  # ---- DEV devices and patching (domain weight 14) -----------------------------
  - id: PC-DEV-01
    domain: DEV
    title: "Devices are inventoried and managed."
    weight: 2
    gate: false
    manual_only: false
    max_age_days: {automatic: 7, manual: 365}
    sources: [G, R]
    fields:
      - G.managedDevices.id
      - G.managedDevices.lastSyncDateTime
      - R.device_id
      - R.last_seen_utc
    rule:
      kind: share
      pass: {at_least: "0.95"}
      partial: {at_least: "0.80"}
      text: "managedDevices id and lastSyncDateTime joined to R device_id; c = devices in both over devices active in either. Pass c at least 0.95; partial 0.80 to under 0.95."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "ID.AM-01", verified: false}
      - {framework: sp800-171, id: "03.04.10", verified: false}
      - {framework: cis, id: "1.1", verified: false}
      - {framework: iso27001, id: "A.5.9", verified: false}
      - {framework: cyber-essentials, id: "Secure configuration", verified: false, uncertain: true}
      - {framework: nis2, id: "i", verified: false}

  - id: PC-DEV-02
    domain: DEV
    title: "Security updates are applied promptly."
    weight: 3
    gate: false
    manual_only: false
    max_age_days: {automatic: 7, manual: null}
    sources: [R]
    fields: [R.last_patch_utc, R.pending_critical]
    rule:
      kind: share
      pass: {at_least: "0.95"}
      partial: {at_least: "0.80"}
      text: "last_patch_utc, pending_critical. Share of DV with no pending critical update or a patch within 30 days: pass at least 0.95; partial 0.80 to under 0.95."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.PS-02", verified: false}
      - {framework: sp800-171, id: "03.14.01", verified: false}
      - {framework: cis, id: "7.3", verified: false}
      - {framework: cis, id: "7.4", verified: false}
      - {framework: iso27001, id: "A.8.8", verified: false}
      - {framework: cyber-essentials, id: "Security update management", verified: false}
      - {framework: nis2, id: "e", verified: false}

  - id: PC-DEV-03
    domain: DEV
    title: "No operating system past vendor support."
    weight: 2
    gate: false
    manual_only: false
    max_age_days: {automatic: 7, manual: null}
    sources: [R, G]
    fields:
      - R.os
      - R.os_build
      - G.managedDevices.operatingSystem
      - G.managedDevices.osVersion
    rule:
      kind: state
      text: "os, os_build or managedDevices operatingSystem and osVersion, joined to OUR shipped lifecycle table (vendor end-of-support dates as dated plain facts, versioned with the ruleset). Pass count 0; partial share at most 0.05."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "ID.AM-08", verified: false}
      - {framework: csf, id: "PR.PS-02", verified: false}
      - {framework: sp800-171, id: "03.14.01", verified: false, uncertain: true}
      - {framework: cis, id: "2.2", verified: false}
      - {framework: iso27001, id: "A.8.8", verified: false}
      - {framework: cyber-essentials, id: "Security update management", verified: false}
      - {framework: nis2, id: "e", verified: false}

  - id: PC-DEV-04
    domain: DEV
    title: "Disk encryption is on."
    weight: 3
    gate: false
    manual_only: false
    max_age_days: {automatic: 7, manual: null}
    sources: [G, R]
    fields: [G.managedDevices.isEncrypted, R.disk_encrypted]
    rule:
      kind: share
      pass: {at_least: "0.98"}
      partial: {at_least: "0.85"}
      text: "managedDevices isEncrypted or disk_encrypted. Pass share at least 0.98; partial 0.85 to under 0.98."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.DS-01", verified: false}
      - {framework: sp800-171, id: "03.13.08", verified: false}
      - {framework: cis, id: "3.6", verified: false}
      - {framework: iso27001, id: "A.8.24", verified: false, uncertain: true}
      - {framework: cyber-essentials, id: "Secure configuration", verified: false}
      - {framework: nis2, id: "h", verified: false}

  - id: PC-DEV-05
    domain: DEV
    title: "Devices meet a managed compliance baseline."
    weight: 2
    gate: false
    manual_only: false
    max_age_days: {automatic: 7, manual: null}
    sources: [G]
    fields: [G.managedDevices.complianceState]
    rule:
      kind: share
      pass: {at_least: "0.90"}
      partial: {at_least: "0.70"}
      text: "managedDevices complianceState compliant. Pass at least 0.90; partial 0.70 to under 0.90."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.PS-01", verified: false}
      - {framework: sp800-171, id: "03.04.02", verified: false}
      - {framework: cis, id: "4.1", verified: false}
      - {framework: iso27001, id: "A.8.9", verified: false}
      - {framework: cyber-essentials, id: "Secure configuration", verified: false}
      - {framework: nis2, id: "e", verified: false, uncertain: true}

  - id: PC-DEV-06
    domain: DEV
    title: "Screens lock after inactivity."
    weight: 1
    gate: false
    manual_only: false
    max_age_days: {automatic: 35, manual: 365}
    sources: [G]
    fields: [G.deviceConfigurationProfile]
    automatic_unavailable: licence_or_scope
    rule:
      kind: share
      pass: {at_least: "0.90"}
      partial: {at_least: "0.60"}
      text: "The configuration profile must be imported, else unknown. Share of DV covered by an assigned profile with a timeout of at most 15 minutes: pass at least 0.90; partial 0.60 to under 0.90."
    manual_alternative: true
    mappings:
      - {framework: csf, id: "PR.PS-01", verified: false}
      - {framework: sp800-171, id: "03.01.10", verified: false}
      - {framework: cis, id: "4.3", verified: false}
      - {framework: cis, id: "4.10", verified: false}
