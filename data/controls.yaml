# revrook control library: ruleset PC-RULES v0.1 (phase 5, part 1).
#
# The 51 controls of rnd-report-3 section 3.4 (THE-205, revision 10), written by us.
# Wording, tests, weights and thresholds are our own uncalibrated design choices.
# No text of the CIS Controls, the Secure Controls Framework, ISO 27001, the CSA
# CCM or SIG is embedded: the external framework entries under `mappings` are
# identifiers only, and every row ships verified: false. A report prints an
# external identifier only after a person who read the source marks the row
# verified (see app/checks/library.py, visible_mappings). `uncertain: true` is the
# [U] marker of the report: the identifier is recalled with lower confidence.
#
# The file is validated by the models in app/checks/library.py (the JSON Schema is
# app/checks/controls.schema.json). tests/control_fields.yaml must stay equal to the
# field list derived from this file (tests/test_control_fields.py).
#
# Reading guide
#   weight        w3 critical, w2 important, w1 baseline.
#   gate          a failure caps the overall score (see the scoring model).
#   max_age_days  freshness maximum ages in days, automatic / manual. Where the
#                 report names one number for a control it is stored as the
#                 automatic age and the manual age is left empty (null): the
#                 report does not say, and part 2 must settle it.
#   fields        the fields the rule reads; the key of `field_map` or `unavailable`.
#   rule          `text` is the report's rule. `kind` share, count or manual says
#                 the rule is a plain threshold, and `pass`/`partial` then hold the
#                 exact numbers (a share is a decimal text, a count a whole number).
#                 `kind: state` rules are written out in `text` only.
#   automatic_unavailable  the automatic measure cannot be computed from what the
#                 CE importers produce (a licence tier, a permission outside the
#                 verified list, or no importer): the engine gives the control
#                 unknown with this reason, never pass and never fail. The manual
#                 alternative still applies.
#   manual_alternative  an automatic control accepts a dated manual artefact of
#                 the named setting at quality 0.9.

ruleset:
  id: PC-RULES
  version: "0.1"
  source: "rnd-report-3 section 3.4 (THE-205, revision 10)"
  manual_alternative_quality: "0.9"

source_codes:
  G: Graph read-only JSON
  X: Exchange Online export produced by the MSP admin
  R: RMM device CSV
  B: backup CSV
  N: network export CSV
  D: DNS records or our own public DNS check
  T: training CSV
  H: leavers CSV
  M: manual evidence

populations:
  U: enabled member users holding a licence (shared mailboxes and service accounts excluded through a reviewed exclusion list printed in the report)
  A: users holding an admin directory role
  DV: active devices seen within 14 days

domains:
  - {code: ACC, name: Identity and MFA, weight: 22}
  - {code: DEV, name: Devices and patching, weight: 14}
  - {code: END, name: Endpoint protection, weight: 10}
  - {code: EML, name: Email security, weight: 12}
  - {code: BCK, name: Backup and recovery, weight: 16}
  - {code: NET, name: Network, weight: 6}
  - {code: LOG, name: Logging and monitoring, weight: 8}
  - {code: GOV, name: Governance and people, weight: 12}

# Which adapter and which column carries each field.
